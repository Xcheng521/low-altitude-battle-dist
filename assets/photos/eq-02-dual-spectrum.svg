    <rect x="-40" y="-80" width="80" height="20" fill="#2d3748" stroke="#5a6a7a" rx="3"/>
    <line x1="-30" y1="-60" x2="-20" y2="-30" stroke="#4a5568" stroke-width="3"/>
    <line x1="30" y1="-60" x2="20" y2="-30" stroke="#4a5568" stroke-width="3"/>
    <circle cx="0" cy="0" r="70" fill="url(#body)" stroke="#6b7c8d" stroke-width="2"/>
    <circle cx="0" cy="0" r="55" fill="#1a202c" stroke="#3d4a5c" stroke-width="1.5"/>
    <circle cx="-15" cy="-10" r="25" fill="#0a1628" stroke="#00d4ff" stroke-width="1.5"/>
    <circle cx="-15" cy="-10" r="15" fill="#00d4ff" opacity="0.2"/>
    <circle cx="-18" cy="-13" r="5" fill="#00d4ff" opacity="0.8"/>
    <circle cx="25" cy="15" r="18" fill="#2a0a0a" stroke="#ff4444" stroke-width="1.5"/>
    <circle cx="25" cy="15" r="10" fill="#ff4444" opacity="0.3"/>
    <circle cx="25" cy="15" r="4" fill="#ff4444" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <path d="M-70 20 Q0 40 70 20" fill="none" stroke="#5a6a7a" stroke-width="1" opacity="0.5"/>
  </g>
  <g fill="#00d4ff" font-family="monospace" font-size="11" opacity="0.8">
