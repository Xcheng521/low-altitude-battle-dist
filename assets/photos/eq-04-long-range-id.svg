    <text x="40" y="64" opacity="0.5">雷达 + 声光电 复合探测</text>
    <text x="760" y="48" text-anchor="end">RANGE: 15km</text>
    <text x="760" y="64" opacity="0.5" text-anchor="end">EQ-04</text>
