<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#0d1f35"/>
      <stop offset="100%" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6a7a"/>
      <stop offset="50%" stop-color="#3d4a5c"/>
      <stop offset="100%" stop-color="#1e2836"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b7c8d"/>
      <stop offset="50%" stop-color="#4a5868"/>
      <stop offset="100%" stop-color="#2d3a4a"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffaa00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g opacity="0.1" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>
  <circle cx="400" cy="250" r="180" fill="url(#glow-cyan)" opacity="0.5"/>
  <g opacity="0.3" stroke="#00d4ff" stroke-width="1" fill="none" transform="translate(400 280)">
    <circle cx="0" cy="0" r="40"/>
    <circle cx="0" cy="0" r="80"/>
    <circle cx="0" cy="0" r="120"/>
    <circle cx="0" cy="0" r="160"/>
    <line x1="-160" y1="0" x2="160" y2="0"/>
    <line x1="0" y1="-160" x2="0" y2="160"/>
  </g>
  <g transform="translate(400 380)">
    <rect x="-60" y="0" width="120" height="60" fill="url(#body)" stroke="#5a6a7a" rx="4"/>
    <rect x="-50" y="10" width="100" height="10" fill="#1a202c" stroke="#4a5568"/>
    <rect x="-50" y="25" width="100" height="10" fill="#1a202c" stroke="#4a5568"/>
    <rect x="-50" y="40" width="60" height="15" fill="#00d4ff" opacity="0.2" stroke="#00d4ff" stroke-width="0.5"/>
    <rect x="-15" y="-60" width="30" height="60" fill="url(#metal)" stroke="#6b7c8d"/>
    <g transform="translate(0 -70)">
      <path d="M-80 0 Q0 -30 80 0 L60 15 L-60 15 Z" fill="url(#body)" stroke="#6b7c8d" stroke-width="1.5"/>
      <path d="M-70 5 L70 5 L55 12 L-55 12 Z" fill="#3d4a5c"/>
      <line x1="-60" y1="8" x2="60" y2="8" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>
  <g fill="#00d4ff" font-family="monospace" font-size="11" opacity="0.8">
